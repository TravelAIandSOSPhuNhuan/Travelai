<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b5ed7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="TravelAI" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="description" content="Chụp một địa danh, nghe hướng dẫn viên AI thuyết minh. Du lịch Việt Nam thông minh hơn." />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>TravelAI – Hướng dẫn viên AI</title>
<link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Font tải không chặn hiển thị: trang hiện ngay bằng font máy, font đẹp tải xong thì tự thay -->
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<style>
  :root {
    --bg: #f2f5fb; --card: #fff; --ink: #0f1b2d; --muted: #61708a; --line: #e4e9f2;
    --brand: #0b5ed7; --brand2: #12b5a5; --gold: #f5b301; --soft: #e9f1fe; --danger: #e5383b; --ok: #12a150;
    --r: 22px; --shadow: 0 8px 28px rgba(15, 27, 45, .08);
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body { font-family: "Be Vietnam Pro", system-ui, -apple-system, sans-serif; color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  a { color: var(--brand); }
  .hidden { display: none !important; }

  /* ---- bong bóng chat ---- */
  .chatfab { position: fixed; right: 14px; bottom: calc(env(safe-area-inset-bottom) + 92px); z-index: 60; width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #fff; font-size: 26px; display: grid; place-items: center; box-shadow: 0 10px 24px rgba(11,94,215,.38); }
  .chatfab:active { transform: scale(.94); }
  .cbadge { position: absolute; top: -3px; right: -3px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--danger); color: #fff; font-size: 12px; font-weight: 800; display: grid; place-items: center; border: 2px solid #fff; }
  .chatp { position: fixed; inset: 0; z-index: 97; background: var(--bg); display: flex; flex-direction: column; }
  .chead { display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 10px) 14px 10px; background: #fff; border-bottom: 1px solid var(--line); }
  .cback { font-size: 22px; width: 36px; height: 36px; border-radius: 50%; background: var(--soft); color: var(--brand); }
  .chead .logo { width: 38px; height: 38px; font-size: 17px; }
  .ct { flex: 1; min-width: 0; } .ct b { display: block; font-size: 15.5px; } .ct span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cnotif { margin: 8px 14px 0; padding: 9px 12px; border-radius: 12px; background: #fff4d6; color: #7a5200; font-weight: 600; font-size: 13.5px; text-align: left; }
  .cmsgs { flex: 1; overflow-y: auto; padding: 12px 12px 6px; display: flex; flex-direction: column; gap: 6px; -webkit-overflow-scrolling: touch; }
  .cday { align-self: center; font-size: 11.5px; color: var(--muted); background: #e7ecf5; padding: 2px 10px; border-radius: 999px; margin: 6px 0; }
  .cempty { margin: auto; color: var(--muted); text-align: center; padding: 30px; font-size: 14px; }
  .cb { max-width: 80%; padding: 8px 12px 5px; border-radius: 18px; font-size: 15px; line-height: 1.4; white-space: pre-line; word-wrap: break-word; box-shadow: 0 1px 2px rgba(15,27,45,.06); }
  .cb.me { align-self: flex-end; background: var(--brand); color: #fff; border-bottom-right-radius: 6px; }
  .cb.them { align-self: flex-start; background: #fff; border-bottom-left-radius: 6px; }
  .cb small { display: block; font-size: 10.5px; opacity: .7; text-align: right; margin-top: 2px; }
  .cb.pend { opacity: .65; } .cb.fail { background: #fdecec; color: var(--danger); }
  .cb img, .cb video { display: block; max-width: 100%; width: 240px; max-height: 320px; object-fit: cover; border-radius: 12px; margin: 2px 0 4px; background: #0002; }
  .cb.sosb { background: #fff1f1; color: #8a1c1e; border: 1px solid #f6c8c9; } .cb.sosb.me { background: #e5383b; color: #fff; border: 0; }
  .vload { display: block; width: 220px; padding: 26px 10px; border-radius: 12px; background: #0003; color: inherit; font-weight: 700; margin: 2px 0 4px; }
  .cform { display: flex; gap: 6px; align-items: center; padding: 8px 10px calc(env(safe-area-inset-bottom) + 8px); background: #fff; border-top: 1px solid var(--line); }
  .cform input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 22px; padding: 10px 14px; font: inherit; font-size: 15px; outline: 0; background: var(--bg); }
  .cic { width: 40px; height: 40px; border-radius: 50%; font-size: 20px; flex: none; }
  .csend { width: 42px; height: 42px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 18px; flex: none; }
  .vmenu { position: absolute; left: 10px; bottom: calc(env(safe-area-inset-bottom) + 66px); background: #fff; border-radius: 16px; box-shadow: 0 12px 30px rgba(0,0,0,.18); overflow: hidden; z-index: 2; }
  .vmenu button { display: block; width: 100%; text-align: left; padding: 13px 16px; font-weight: 600; font-size: 14.5px; border-top: 1px solid var(--line); }
  .vmenu button:first-child { border-top: 0; }
  .vstat { margin: 0 12px 6px; padding: 8px 12px; border-radius: 12px; background: var(--soft); color: var(--brand); font-weight: 600; font-size: 13.5px; }
  .vrec { position: fixed; inset: 0; z-index: 99; background: #000; }
  .vrec video { width: 100%; height: 100%; object-fit: contain; }
  .vrtop { position: absolute; top: calc(env(safe-area-inset-top) + 10px); left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; color: #fff; font-weight: 700; }
  .vrtop button { width: 42px; height: 42px; border-radius: 50%; background: #fff3; color: #fff; font-size: 20px; }
  .vrbot { position: absolute; bottom: calc(env(safe-area-inset-bottom) + 24px); left: 0; right: 0; display: flex; justify-content: center; }
  .vgo { width: 76px; height: 76px; border-radius: 50%; background: #e5383b; color: #fff; font-size: 30px; border: 5px solid #fff; }
  .phonednd { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: #fff7e6; font-size: 14px; }
  .phonednd b { display: block; margin-bottom: 4px; color: #7a5200; }
  .phonednd p { white-space: pre-line; color: #5b4a2a; }
  #dndOpts button { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 14px 4px; border-top: 1px solid var(--line); font-weight: 600; font-size: 15px; text-align: left; }
  #dndOpts button:first-child { border-top: 0; }
  #dndOpts button.on::after { content: "✓"; color: var(--brand); font-weight: 800; }
  .remember { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); margin: 2px 2px 4px; cursor: pointer; }
  .remember input { width: 18px; height: 18px; accent-color: var(--brand); margin: 0; }
  .langbusy { position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 50%; transform: translateX(-50%); z-index: 120; background: #0b5ed7; color: #fff; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; box-shadow: 0 6px 18px rgba(11,94,215,.35); white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
  .app { max-width: 520px; margin: 0 auto; min-height: 100vh; padding: calc(var(--safe-t) + 10px) 16px calc(110px + var(--safe-b)); }

  /* Header */
  header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin: 0 -16px 12px; padding: calc(var(--safe-t) + 10px) 16px 10px; background: rgba(242, 245, 251, .86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .brand { display: flex; gap: 10px; align-items: center; }
  .logo { width: 40px; height: 40px; border-radius: 13px; background: linear-gradient(135deg, var(--brand), var(--brand2)); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 19px; box-shadow: 0 6px 14px rgba(11, 94, 215, .3); }
  .brand b { font-size: 19px; letter-spacing: .4px; display: block; line-height: 1.1; }
  .brand b span { color: var(--brand); }
  .brand small { font-size: 9px; letter-spacing: 1.5px; color: var(--muted); font-weight: 600; }
  .brand small { white-space: nowrap; }
  @media (max-width: 400px) { .brand small { letter-spacing: .4px; font-size: 8.5px; } .brand b { font-size: 17px; } }
  .hdr-r { display: flex; gap: 8px; align-items: center; }
  .langbtn { display: flex; align-items: center; gap: 6px; background: #fff; border-radius: 99px; padding: 7px 11px; font-size: 13px; font-weight: 700; box-shadow: var(--shadow); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(18, 161, 80, .15); }
  .dot.off { background: var(--danger); box-shadow: 0 0 0 4px rgba(229, 56, 59, .15); }

  /* Cards */
  .card { background: var(--card); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
  h2 { font-size: 17px; margin: 18px 2px 10px; display: flex; justify-content: space-between; align-items: center; }
  h2 button { font-size: 13px; color: var(--brand); font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }

  /* Hero */
  .hero { position: relative; overflow: hidden; border-radius: 26px; padding: 22px 20px 20px; color: #fff; margin-bottom: 14px;
    background: radial-gradient(120% 90% at 100% 0%, rgba(18, 181, 165, .9) 0%, rgba(18, 181, 165, 0) 55%), linear-gradient(150deg, #0b5ed7 0%, #0a3f94 100%);
    box-shadow: 0 16px 34px rgba(11, 64, 148, .28); }
  .hero::after { content: ""; position: absolute; right: -40px; bottom: -40px; width: 170px; height: 170px; border-radius: 50%; border: 26px solid rgba(255, 255, 255, .07); }
  .hero h1 { font-size: 25px; line-height: 1.22; margin-bottom: 6px; max-width: 92%; }
  .hero p { opacity: .9; font-size: 14px; margin-bottom: 18px; max-width: 95%; }
  .snap { position: relative; display: flex; align-items: center; gap: 14px; background: #fff; color: var(--ink); border-radius: 20px; padding: 12px 14px; cursor: pointer; z-index: 1; }
  .snap input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
  .snap .cam { width: 52px; height: 52px; flex: none; border-radius: 16px; display: grid; place-items: center; font-size: 26px; background: linear-gradient(135deg, var(--gold), #ff8a00); box-shadow: 0 6px 14px rgba(245, 140, 0, .35); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.06) } }
  .snap b { display: block; font-size: 16px; }
  .snap span { font-size: 12px; color: var(--muted); }

  .search { display: flex; gap: 8px; background: #fff; border-radius: 18px; padding: 6px; box-shadow: var(--shadow); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 15px; padding: 10px 10px; background: transparent; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 16px; border-radius: 14px; font-weight: 700; font-size: 15px; white-space: nowrap; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-ghost { background: var(--soft); color: var(--brand); }
  .btn:disabled { opacity: .55; }

  .pop { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pop button { display: flex; align-items: center; gap: 10px; text-align: left; background: #fff; border-radius: 16px; padding: 12px; box-shadow: var(--shadow); font-weight: 600; font-size: 13.5px; line-height: 1.3; transition: transform .15s; }
  .pop button:active { transform: scale(.97); }
  .pop .e { font-size: 24px; width: 38px; height: 38px; flex: none; border-radius: 12px; background: var(--soft); display: grid; place-items: center; }

  .recent { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
  .recent::-webkit-scrollbar { display: none; }
  .rc { flex: none; width: 132px; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); text-align: left; }
  .rc .img { height: 88px; background: linear-gradient(135deg, #cfe0fb, #c9f0ea); display: grid; place-items: center; font-size: 30px; background-size: cover; background-position: center; }
  .rc b { display: block; font-size: 13px; padding: 8px 10px 10px; line-height: 1.3; }

  /* Place view */
  .ph { position: relative; height: 240px; margin: 0 -16px 0; overflow: hidden; background: linear-gradient(140deg, #0b5ed7, #12b5a5); background-size: cover; background-position: center; }
  .ph .emoji { position: absolute; inset: 0; display: grid; place-items: center; font-size: 70px; opacity: .9; }
  .ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.25) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,.55) 100%); }
  .ph .backb { position: absolute; z-index: 3; top: 12px; left: 12px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.9); font-size: 20px; display: grid; place-items: center; box-shadow: var(--shadow); }
  .ph .scanline { position: absolute; z-index: 2; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #7ff7e9, transparent); box-shadow: 0 0 18px 4px rgba(127, 247, 233, .7); animation: scan 1.6s ease-in-out infinite; }
  .ph .corners { position: absolute; z-index: 2; inset: 26px; border-radius: 18px;
    background: linear-gradient(#fff,#fff) top left/28px 3px, linear-gradient(#fff,#fff) top left/3px 28px, linear-gradient(#fff,#fff) top right/28px 3px, linear-gradient(#fff,#fff) top right/3px 28px,
      linear-gradient(#fff,#fff) bottom left/28px 3px, linear-gradient(#fff,#fff) bottom left/3px 28px, linear-gradient(#fff,#fff) bottom right/28px 3px, linear-gradient(#fff,#fff) bottom right/3px 28px;
    background-repeat: no-repeat; opacity: .9; }
  @keyframes scan { 0% { top: 12% } 50% { top: 86% } 100% { top: 12% } }
  .pcard { position: relative; z-index: 4; margin-top: -34px; }
  .ptitle { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .ptitle h3 { font-size: 22px; line-height: 1.25; }
  .badge { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 99px; background: #e6f7ee; color: var(--ok); white-space: nowrap; margin-top: 4px; }
  .loc { font-size: 13px; color: var(--muted); margin: 4px 0 2px; }
  .addr { display: block; font-size: 14px; font-weight: 600; color: var(--text, #1b2330); margin: 6px 0 2px; text-decoration: none; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--brand); font-weight: 600; margin-top: 8px; }

  /* Player */
  .player { display: flex; align-items: center; gap: 12px; margin: 14px 0 6px; padding: 10px; border-radius: 18px; background: linear-gradient(135deg, var(--soft), #e8f8f5); }
  .pbtn { width: 50px; height: 50px; flex: none; border-radius: 50%; background: var(--brand); color: #fff; font-size: 20px; display: grid; place-items: center; box-shadow: 0 6px 14px rgba(11, 94, 215, .35); }
  .pinfo { flex: 1; min-width: 0; }
  .pinfo b { font-size: 14px; display: block; }
  .pinfo span { font-size: 12px; color: var(--muted); }
  .bar { height: 5px; border-radius: 9px; background: rgba(11, 94, 215, .15); margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--brand), var(--brand2)); border-radius: 9px; transition: width .4s; }
  .pstop { width: 38px; height: 38px; flex: none; border-radius: 50%; background: #fff; color: var(--brand); font-size: 14px; display: grid; place-items: center; }
  .wave { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
  .wave i { width: 3px; background: currentColor; border-radius: 2px; animation: w 1s ease-in-out infinite; }
  .wave i:nth-child(2) { animation-delay: .15s } .wave i:nth-child(3) { animation-delay: .3s }
  @keyframes w { 0%, 100% { height: 4px } 50% { height: 14px } }

  .narr { font-size: 16px; line-height: 1.7; margin-top: 10px; }
  .narr .s { transition: background .25s, color .25s; border-radius: 6px; padding: 1px 0; }
  .narr .s.on { background: rgba(245, 179, 1, .25); color: #000; box-shadow: 0 0 0 3px rgba(245, 179, 1, .25); }
  .narr.typing::after { content: "▍"; color: var(--brand); animation: blink 1s steps(2) infinite; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0 } }
  .skel { height: 13px; border-radius: 8px; margin: 10px 0; background: linear-gradient(90deg, #edf1f7 25%, #e1e7f0 37%, #edf1f7 63%); background-size: 400% 100%; animation: sk 1.3s ease infinite; }
  @keyframes sk { 0% { background-position: 100% 50% } 100% { background-position: 0 50% } }

  .sec { margin-top: 16px; }
  .sec h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
  .facts { display: grid; gap: 8px; }
  .facts div { background: var(--bg); border-radius: 12px; padding: 9px 12px; font-size: 14px; }
  .sec ul { padding-left: 18px; font-size: 14px; }
  .sec li { margin-bottom: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { background: #fff; border: 1px solid var(--line); border-radius: 99px; padding: 7px 12px; font-size: 13px; font-weight: 600; }
  .chip.go { color: var(--brand); border-color: #cddcf7; background: var(--soft); }
  .disc { font-size: 11.5px; color: var(--muted); margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }

  /* Chat */
  .chat { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .msg { padding: 9px 13px; border-radius: 16px; font-size: 14.5px; max-width: 88%; white-space: pre-line; }
  .msg.me { align-self: flex-end; background: var(--brand); color: #fff; border-bottom-right-radius: 5px; }
  .msg.ai { align-self: flex-start; background: var(--bg); border-bottom-left-radius: 5px; }
  .askf { display: flex; gap: 8px; margin-top: 10px; }
  .askf input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; font: inherit; font-size: 15px; outline: 0; }
  .askf input:focus { border-color: var(--brand); }

  /* History */
  .hist { display: flex; flex-direction: column; gap: 10px; }
  .hi { display: flex; gap: 12px; align-items: center; text-align: left; background: #fff; border-radius: 16px; padding: 10px; box-shadow: var(--shadow); }
  .hi .img { width: 58px; height: 58px; flex: none; border-radius: 12px; background: linear-gradient(135deg, #cfe0fb, #c9f0ea); background-size: cover; background-position: center; display: grid; place-items: center; font-size: 24px; }
  .hi b { display: block; font-size: 15px; }

  /* SOS */
  .sosv { text-align: center; padding: 22px 16px; }
  .sosbig { width: 180px; height: 180px; border-radius: 50%; margin: 18px auto; display: grid; place-items: center; color: #fff; font-size: 40px; font-weight: 800; letter-spacing: 2px;
    background: radial-gradient(circle at 35% 30%, #ff6b6e, var(--danger)); box-shadow: 0 0 0 14px #fde3e3, 0 0 0 28px #fff1f1, 0 16px 30px rgba(229, 56, 59, .35); animation: sp 2s ease-in-out infinite; }
  @keyframes sp { 0%, 100% { box-shadow: 0 0 0 14px #fde3e3, 0 0 0 28px #fff1f1, 0 16px 30px rgba(229, 56, 59, .35) } 50% { box-shadow: 0 0 0 18px #fde3e3, 0 0 0 36px #fff5f5, 0 16px 30px rgba(229, 56, 59, .35) } }
  .locbox { text-align: left; }
  .locbox .row { flex-wrap: wrap; }
  .helpc textarea { width: 100%; border: 1px solid var(--line); border-radius: 13px; padding: 10px 12px; font: inherit; font-size: 15px; margin: 10px 0 8px; resize: vertical; outline: 0; }
  .helpc textarea:focus { border-color: var(--brand); }
  .helpc .chips { margin-top: 10px; }
  .chip.sel { background: var(--brand); color: #fff; border-color: var(--brand); }
  #helpRecBtn { width: 100%; }
  #helpRecBtn.rec { background: #fdecec; color: var(--danger); animation: pulse 1.2s infinite; }
  #helpAudioWrap audio { width: 100%; margin-top: 8px; }
  .hreq { border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-top: 12px; }
  .hreq .hh { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
  .pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: #eef3ff; color: var(--brand); white-space: nowrap; }
  .pill.new { background: #fff4d6; color: #8a5a00; } .pill.handling { background: #e7f6ef; color: #0f7a4a; } .pill.done { background: #eceff3; color: #5b6472; }
  .hreq .chat { margin-top: 8px; }
  .msg.adm { align-self: flex-start; background: #e7f6ef; border-bottom-left-radius: 5px; }
  .msg.adm b { display: block; font-size: 11.5px; color: #0f7a4a; }

  const devKey = (() => {

    // Bản đồ chính: OpenStreetMap (miễn phí, không cần key). Lỗi liên tục thì tự đổi sang bản đồ dự phòng Esri.
    const SRC = [
      ["https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }],
      ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "© Esri, © OpenStreetMap" }],

      layer.addTo(m);

    for (const [max, q] of [[1280, 0.72], [1024, 0.62], [800, 0.55]]) {
      const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");

  }

  // ---- video: quay trong app (nhẹ) hoặc chọn video có sẵn (tự nén nếu lớn) ----
  const CHUNK = 700000, VMAX = 7 * 1048576;
  const pickMime = (list) => (window.MediaRecorder && list.find((m) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m))) || "";
  const VMIMES = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp8,opus", "video/webm"];
  async function sendVideoBlob(blob) {

  // nén lại video lớn: phát qua canvas 480p và ghi lại ở ~450 kbps (mất đúng bằng thời lượng video)
  async function shrinkVideo(file, onProg) {
    if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) throw { code: "unsupported" };
    const url = URL.createObjectURL(file), v = document.createElement("video");
    v.src = url; v.playsInline = true; v.preload = "auto";
    await new Promise((ok, no) => { v.onloadedmetadata = ok; v.onerror = no; });
    if (!(v.duration < 62)) throw { code: "too_long" };
    const s = Math.min(1, 480 / Math.max(v.videoWidth, v.videoHeight)), c = document.createElement("canvas");
    c.width = Math.round(v.videoWidth * s / 2) * 2; c.height = Math.round(v.videoHeight * s / 2) * 2;
    const g = c.getContext("2d"), stream = c.captureStream(24);
    let actx2 = null;
    try { actx2 = new (window.AudioContext || window.webkitAudioContext)(); const srcN = actx2.createMediaElementSource(v), dest = actx2.createMediaStreamDestination(); srcN.connect(dest); dest.stream.getAudioTracks().forEach((tr) => stream.addTrack(tr)); } catch {}
    const mime = pickMime(VMIMES);
    const rec = new MediaRecorder(stream, Object.assign({ videoBitsPerSecond: 450000, audioBitsPerSecond: 48000 }, mime ? { mimeType: mime } : {}));
    const parts = []; rec.ondataavailable = (e) => { if (e.data && e.data.size) parts.push(e.data); };
    const done = new Promise((ok) => (rec.onstop = ok));
    let raf = 0; const draw = () => { g.drawImage(v, 0, 0, c.width, c.height); onProg && onProg(Math.min(1, v.currentTime / v.duration)); if (!v.ended) raf = requestAnimationFrame(draw); };
    rec.start(1000); await v.play(); draw();
    await new Promise((ok) => (v.onended = ok));
    cancelAnimationFrame(raf); rec.stop(); await done;
    try { actx2 && actx2.close(); } catch {}
    URL.revokeObjectURL(url);
    return new Blob(parts, { type: rec.mimeType || mime || "video/webm" });
  }
  // quay video ngay trong app: 480p, tối đa 30 giây -> ~1-2 MB
  let vr = null;
  $("vidRec").onclick = async () => {

  $("vrecGo").onclick = () => {

  // ---- thông báo trên màn hình điện thoại ----

  const PUSH_KEY = "BINNK9mH25T2n_ocXUl6oSLP9G1EPUnuoIF6G2ZpATgGAatY4rATGNjZbFbTf7M_-RIaom0NrmsdSCQ_HiKx0sU"; // khoá công khai, khớp với máy chủ thông báo Cloudflare
  let pushUrl = store.get("pushUrl", ""), pushOn = false;

  async function loadPushCfg() {

  // gửi thông báo tới ban điều hành qua máy chủ Cloudflare (chạy nền, lỗi cũng không ảnh hưởng tin nhắn)

  /* ================= Không làm phiền ================= */
  const DND_FOREVER = 9e15;

    return t("dnd_until") + " " + d.toLocaleTimeString(LANGS[lang].code || undefined, { hour: "2-digit", minute: "2-digit" }) + (same ? "" : " " + d.toLocaleDateString(LANGS[lang].code || undefined, { day: "2-digit", month: "2-digit" }));
  }
  function renderDnd() {

  /* ================= Tuỳ chọn ngôn ngữ: dịch giao diện bằng AI ================= */
  const uiBusy = {};
  const uiKeys = () => [...new Set(Object.keys(T.en).concat(Object.keys(T.vi)))];
  function ensureUI(lg) {
    if (lg === "vi" || lg === "en" || !LANGS[lg]) return Promise.resolve();
    if (uiBusy[lg]) return uiBusy[lg];
    const have = Object.assign({}, T[lg] || {}, dynT[lg] || {});

  async function identifyLang(txt) {
    const low = txt.toLowerCase().trim();
    const hit = Object.entries(LANGS).find(([k, v]) => [v.label, v.name, k].some((x) => x && (x.toLowerCase() === low || x.toLowerCase().split(/[ ()]+/).includes(low))));

  }

})();
