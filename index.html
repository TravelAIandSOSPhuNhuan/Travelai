<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b5ed7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>TravelAI – Hướng dẫn viên AI</title>
<link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f2f5fb; --card: #fff; --ink: #0f1b2d; --muted: #61708a; --line: #e4e9f2;
    --brand: #0b5ed7; --brand2: #12b5a5; --gold: #f5b301; --soft: #e9f1fe; --danger: #e5383b; --ok: #12a150;
    --r: 22px; --shadow: 0 8px 28px rgba(15, 27, 45, .08);
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body { font-family: "Be Vietnam Pro", system-ui, -apple-system, sans-serif; color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  a { color: var(--brand); }
  .hidden { display: none !important; }
  .app { max-width: 520px; margin: 0 auto; min-height: 100vh; padding: calc(var(--safe-t) + 10px) 16px calc(110px + var(--safe-b)); }

  /* Header */
  header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin: 0 -16px 12px; padding: calc(var(--safe-t) + 10px) 16px 10px; background: rgba(242, 245, 251, .86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .brand { display: flex; gap: 10px; align-items: center; }
  .logo { width: 40px; height: 40px; border-radius: 13px; background: linear-gradient(135deg, var(--brand), var(--brand2)); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 19px; box-shadow: 0 6px 14px rgba(11, 94, 215, .3); }
  .brand b { font-size: 19px; letter-spacing: .4px; display: block; line-height: 1.1; }
  .brand b span { color: var(--brand); }
  .brand small { font-size: 9px; letter-spacing: 1.5px; color: var(--muted); font-weight: 600; }
  .hdr-r { display: flex; gap: 8px; align-items: center; }
  .langbtn { display: flex; align-items: center; gap: 6px; background: #fff; border-radius: 99px; padding: 7px 11px; font-size: 13px; font-weight: 700; box-shadow: var(--shadow); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(18, 161, 80, .15); }
  .dot.off { background: var(--danger); box-shadow: 0 0 0 4px rgba(229, 56, 59, .15); }

  /* Cards */
  .card { background: var(--card); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
  h2 { font-size: 17px; margin: 18px 2px 10px; display: flex; justify-content: space-between; align-items: center; }
  h2 button { font-size: 13px; color: var(--brand); font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }

  /* Hero */
  .hero { position: relative; overflow: hidden; border-radius: 26px; padding: 22px 20px 20px; color: #fff; margin-bottom: 14px;
    background: radial-gradient(120% 90% at 100% 0%, rgba(18, 181, 165, .9) 0%, rgba(18, 181, 165, 0) 55%), linear-gradient(150deg, #0b5ed7 0%, #0a3f94 100%);
    box-shadow: 0 16px 34px rgba(11, 64, 148, .28); }
  .hero::after { content: ""; position: absolute; right: -40px; bottom: -40px; width: 170px; height: 170px; border-radius: 50%; border: 26px solid rgba(255, 255, 255, .07); }
  .hero h1 { font-size: 25px; line-height: 1.22; margin-bottom: 6px; max-width: 92%; }
  .hero p { opacity: .9; font-size: 14px; margin-bottom: 18px; max-width: 95%; }
  .snap { position: relative; display: flex; align-items: center; gap: 14px; background: #fff; color: var(--ink); border-radius: 20px; padding: 12px 14px; cursor: pointer; z-index: 1; }
  .snap input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
  .snap .cam { width: 52px; height: 52px; flex: none; border-radius: 16px; display: grid; place-items: center; font-size: 26px; background: linear-gradient(135deg, var(--gold), #ff8a00); box-shadow: 0 6px 14px rgba(245, 140, 0, .35); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.06) } }
  .snap b { display: block; font-size: 16px; }
  .snap span { font-size: 12px; color: var(--muted); }

  .search { display: flex; gap: 8px; background: #fff; border-radius: 18px; padding: 6px; box-shadow: var(--shadow); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 15px; padding: 10px 10px; background: transparent; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 16px; border-radius: 14px; font-weight: 700; font-size: 15px; white-space: nowrap; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-ghost { background: var(--soft); color: var(--brand); }
  .btn:disabled { opacity: .55; }

  .pop { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pop button { display: flex; align-items: center; gap: 10px; text-align: left; background: #fff; border-radius: 16px; padding: 12px; box-shadow: var(--shadow); font-weight: 600; font-size: 13.5px; line-height: 1.3; transition: transform .15s; }
  .pop button:active { transform: scale(.97); }
  .pop .e { font-size: 24px; width: 38px; height: 38px; flex: none; border-radius: 12px; background: var(--soft); display: grid; place-items: center; }

  .recent { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
  .recent::-webkit-scrollbar { display: none; }
  .rc { flex: none; width: 132px; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); text-align: left; }
  .rc .img { height: 88px; background: linear-gradient(135deg, #cfe0fb, #c9f0ea); display: grid; place-items: center; font-size: 30px; background-size: cover; background-position: center; }
  .rc b { display: block; font-size: 13px; padding: 8px 10px 10px; line-height: 1.3; }

  /* Place view */
  .ph { position: relative; height: 240px; margin: 0 -16px 0; overflow: hidden; background: linear-gradient(140deg, #0b5ed7, #12b5a5); background-size: cover; background-position: center; }
  .ph .emoji { position: absolute; inset: 0; display: grid; place-items: center; font-size: 70px; opacity: .9; }
  .ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.25) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,.55) 100%); }
  .ph .backb { position: absolute; z-index: 3; top: 12px; left: 12px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.9); font-size: 20px; display: grid; place-items: center; box-shadow: var(--shadow); }
  .ph .scanline { position: absolute; z-index: 2; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #7ff7e9, transparent); box-shadow: 0 0 18px 4px rgba(127, 247, 233, .7); animation: scan 1.6s ease-in-out infinite; }
  .ph .corners { position: absolute; z-index: 2; inset: 26px; border-radius: 18px;
    background: linear-gradient(#fff,#fff) top left/28px 3px, linear-gradient(#fff,#fff) top left/3px 28px, linear-gradient(#fff,#fff) top right/28px 3px, linear-gradient(#fff,#fff) top right/3px 28px,
      linear-gradient(#fff,#fff) bottom left/28px 3px, linear-gradient(#fff,#fff) bottom left/3px 28px, linear-gradient(#fff,#fff) bottom right/28px 3px, linear-gradient(#fff,#fff) bottom right/3px 28px;
    background-repeat: no-repeat; opacity: .9; }
  @keyframes scan { 0% { top: 12% } 50% { top: 86% } 100% { top: 12% } }
  .pcard { position: relative; z-index: 4; margin-top: -34px; }
  .ptitle { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .ptitle h3 { font-size: 22px; line-height: 1.25; }
  .badge { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 99px; background: #e6f7ee; color: var(--ok); white-space: nowrap; margin-top: 4px; }
  .loc { font-size: 13px; color: var(--muted); margin: 4px 0 2px; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--brand); font-weight: 600; margin-top: 8px; }

  /* Player */
  .player { display: flex; align-items: center; gap: 12px; margin: 14px 0 6px; padding: 10px; border-radius: 18px; background: linear-gradient(135deg, var(--soft), #e8f8f5); }
  .pbtn { width: 50px; height: 50px; flex: none; border-radius: 50%; background: var(--brand); color: #fff; font-size: 20px; display: grid; place-items: center; box-shadow: 0 6px 14px rgba(11, 94, 215, .35); }
  .pinfo { flex: 1; min-width: 0; }
  .pinfo b { font-size: 14px; display: block; }
  .pinfo span { font-size: 12px; color: var(--muted); }
  .bar { height: 5px; border-radius: 9px; background: rgba(11, 94, 215, .15); margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--brand), var(--brand2)); border-radius: 9px; transition: width .4s; }
  .pstop { width: 38px; height: 38px; flex: none; border-radius: 50%; background: #fff; color: var(--brand); font-size: 14px; display: grid; place-items: center; }
  .wave { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
  .wave i { width: 3px; background: currentColor; border-radius: 2px; animation: w 1s ease-in-out infinite; }
  .wave i:nth-child(2) { animation-delay: .15s } .wave i:nth-child(3) { animation-delay: .3s }
  @keyframes w { 0%, 100% { height: 4px } 50% { height: 14px } }

  .narr { font-size: 16px; line-height: 1.7; margin-top: 10px; }
  .narr .s { transition: background .25s, color .25s; border-radius: 6px; padding: 1px 0; }
  .narr .s.on { background: rgba(245, 179, 1, .25); color: #000; box-shadow: 0 0 0 3px rgba(245, 179, 1, .25); }
  .narr.typing::after { content: "▍"; color: var(--brand); animation: blink 1s steps(2) infinite; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0 } }
  .skel { height: 13px; border-radius: 8px; margin: 10px 0; background: linear-gradient(90deg, #edf1f7 25%, #e1e7f0 37%, #edf1f7 63%); background-size: 400% 100%; animation: sk 1.3s ease infinite; }
  @keyframes sk { 0% { background-position: 100% 50% } 100% { background-position: 0 50% } }

  .sec { margin-top: 16px; }
  .sec h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
  .facts { display: grid; gap: 8px; }
  .facts div { background: var(--bg); border-radius: 12px; padding: 9px 12px; font-size: 14px; }
  .sec ul { padding-left: 18px; font-size: 14px; }
  .sec li { margin-bottom: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { background: #fff; border: 1px solid var(--line); border-radius: 99px; padding: 7px 12px; font-size: 13px; font-weight: 600; }
  .chip.go { color: var(--brand); border-color: #cddcf7; background: var(--soft); }
  .disc { font-size: 11.5px; color: var(--muted); margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }

  /* Chat */
  .chat { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .msg { padding: 9px 13px; border-radius: 16px; font-size: 14.5px; max-width: 88%; white-space: pre-line; }
  .msg.me { align-self: flex-end; background: var(--brand); color: #fff; border-bottom-right-radius: 5px; }
  .msg.ai { align-self: flex-start; background: var(--bg); border-bottom-left-radius: 5px; }
  .askf { display: flex; gap: 8px; margin-top: 10px; }
  .askf input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; font: inherit; font-size: 15px; outline: 0; }
  .askf input:focus { border-color: var(--brand); }

  /* History */
  .hist { display: flex; flex-direction: column; gap: 10px; }
  .hi { display: flex; gap: 12px; align-items: center; text-align: left; background: #fff; border-radius: 16px; padding: 10px; box-shadow: var(--shadow); }
  .hi .img { width: 58px; height: 58px; flex: none; border-radius: 12px; background: linear-gradient(135deg, #cfe0fb, #c9f0ea); background-size: cover; background-position: center; display: grid; place-items: center; font-size: 24px; }
  .hi b { display: block; font-size: 15px; }

  /* SOS */
  .sosv { text-align: center; padding: 22px 16px; }
  .sosbig { width: 180px; height: 180px; border-radius: 50%; margin: 18px auto; display: grid; place-items: center; color: #fff; font-size: 40px; font-weight: 800; letter-spacing: 2px;
    background: radial-gradient(circle at 35% 30%, #ff6b6e, var(--danger)); box-shadow: 0 0 0 14px #fde3e3, 0 0 0 28px #fff1f1, 0 16px 30px rgba(229, 56, 59, .35); animation: sp 2s ease-in-out infinite; }
  @keyframes sp { 0%, 100% { box-shadow: 0 0 0 14px #fde3e3, 0 0 0 28px #fff1f1, 0 16px 30px rgba(229, 56, 59, .35) } 50% { box-shadow: 0 0 0 18px #fde3e3, 0 0 0 36px #fff5f5, 0 16px 30px rgba(229, 56, 59, .35) } }
  .locbox { text-align: left; }
  .coords { font-size: 18px; font-weight: 700; margin: 4px 0 8px; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .callrow { display: flex; align-items: center; gap: 14px; padding: 13px 14px; border-radius: 16px; background: var(--bg); text-decoration: none; color: var(--ink); margin-bottom: 9px; }
  .callrow .ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 24px; background: #fff; flex: none; }
  .callrow b { font-size: 26px; color: var(--danger); min-width: 54px; font-variant-numeric: tabular-nums; }
  .callrow span { font-weight: 600; flex: 1; }
  .callrow .ph-ic { color: #fff; background: var(--ok); width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; }

  /* Sheets */
  .sheetbg { position: fixed; inset: 0; z-index: 50; background: rgba(15, 27, 45, .45); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
  .sheet { background: #fff; width: 100%; max-width: 520px; border-radius: 24px 24px 0 0; padding: 10px 18px calc(20px + var(--safe-b)); max-height: 88vh; overflow-y: auto; animation: up .25s ease-out; }
  .sheet .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 12px; }
  .sheet h3 { font-size: 19px; margin-bottom: 4px; }
  @keyframes up { from { transform: translateY(40px); opacity: .4 } to { transform: none; opacity: 1 } }
  @keyframes fade { from { opacity: 0 } }
  .langs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 6px; }
  .lang { display: flex; align-items: center; gap: 8px; padding: 12px; border-radius: 14px; background: var(--bg); font-weight: 600; border: 2px solid transparent; }
  .lang.on { border-color: var(--brand); background: var(--soft); color: var(--brand); }
  .setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); }
  .setrow b { font-size: 15px; display: block; }
  .switch { width: 46px; height: 28px; border-radius: 99px; background: #c4cfdf; position: relative; transition: .2s; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch.on { background: var(--brand); } .switch.on::after { left: 21px; }
  .seg { display: flex; background: var(--bg); border-radius: 12px; padding: 4px; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
  .seg button { flex: 1 1 45%; padding: 9px 6px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: #fff; color: var(--brand); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .sheet input[type=text] { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); font: inherit; margin: 12px 0 6px; }
  .sheet .btn { width: 100%; margin-top: 8px; }

  /* Bottom nav */
  nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: flex; justify-content: center; padding-bottom: var(--safe-b);
    background: rgba(255, 255, 255, .92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
  nav .in { display: flex; width: 100%; max-width: 520px; align-items: flex-end; }
  nav button, nav label { flex: 1; padding: 9px 0 11px; font-size: 11px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
  nav .ic { font-size: 21px; line-height: 1.2; }
  nav .on { color: var(--brand); }
  nav .sosn { color: var(--danger); }
  nav .fab { position: relative; }
  nav .fab .ic { width: 58px; height: 58px; border-radius: 50%; margin-top: -26px; display: grid; place-items: center; font-size: 26px; color: #fff;
    background: linear-gradient(135deg, var(--brand), var(--brand2)); box-shadow: 0 8px 20px rgba(11, 94, 215, .4); border: 4px solid #fff; }
  nav .fab input { position: absolute; inset: 0; opacity: 0; width: 100%; }
  .toast { position: fixed; bottom: calc(96px + var(--safe-b)); left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 14px; font-size: 13px; z-index: 70; max-width: 90%; text-align: center; animation: fade .2s; }
  .fadein { animation: fade .3s; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">T</div>
      <div><b>TRAVEL<span>AI</span></b><small>YOUR SMART TRAVEL COMPANION</small></div>
    </div>
    <div class="hdr-r">
      <button class="langbtn" id="langBtn" aria-label="Language"><i class="dot" id="aiDot"></i><span id="langFlag">🇻🇳</span><span id="langCode">VI</span></button>
    </div>
  </header>

  <!-- HOME -->
  <section id="v-home" class="fadein">
    <div class="hero">
      <h1 data-i="hero_t"></h1>
      <p data-i="hero_s"></p>
      <label class="snap">
        <input type="file" accept="image/*" class="fileIn" />
        <div class="cam">📷</div>
        <div><b data-i="scan"></b><span data-i="scan_s"></span></div>
      </label>
    </div>
    <form class="search" id="searchForm">
      <input type="text" id="searchIn" data-ph="search_ph" autocomplete="off" enterkeyhint="search" />
      <button class="btn btn-primary" data-i="search"></button>
    </form>
    <div id="recentWrap" class="hidden">
      <h2><span data-i="recent"></span><button data-go="hist" data-i="see_all"></button></h2>
      <div class="recent" id="recent"></div>
    </div>
    <h2><span data-i="popular"></span></h2>
    <div class="pop" id="pop"></div>
  </section>

  <!-- PLACE -->
  <section id="v-place" class="hidden">
    <div class="ph" id="pHero">
      <div class="emoji" id="pEmoji">🏛️</div>
      <div class="corners hidden" id="pCorners"></div>
      <div class="scanline hidden" id="pScan"></div>
      <button class="backb" id="pBack" aria-label="Back">←</button>
    </div>
    <div class="card pcard">
      <div class="ptitle"><h3 id="pTitle"></h3><span class="badge hidden" id="pBadge"></span></div>
      <div class="loc" id="pLoc"></div>
      <div class="status hidden" id="pStatus"><span class="wave"><i></i><i></i><i></i></span><span id="pStatusT"></span></div>
      <div class="player hidden" id="player">
        <button class="pbtn" id="pPlay">▶</button>
        <div class="pinfo"><b id="pState"></b><span id="pVoice"></span><div class="bar"><i id="pBar"></i></div></div>
        <button class="pstop" id="pStop" aria-label="Stop">■</button>
      </div>
      <div class="narr" id="pNarr"></div>
      <div id="pNF" class="hidden"></div>
      <div id="pMore"></div>
    </div>
    <div class="card hidden" id="askCard">
      <h2 style="margin:0 0 6px" data-i="ask_t"></h2>
      <div class="chips" id="suggest"></div>
      <div class="chat" id="chat"></div>
      <form class="askf" id="askForm">
        <input type="text" id="askIn" data-ph="ask_ph" autocomplete="off" enterkeyhint="send" />
        <button class="btn btn-primary" id="askBtn">➤</button>
      </form>
    </div>
  </section>

  <!-- HISTORY -->
  <section id="v-hist" class="hidden fadein">
    <h2 style="margin-top:4px"><span data-i="history"></span></h2>
    <div class="hist" id="hist"></div>
  </section>

  <!-- SOS -->
  <section id="v-sos" class="hidden fadein">
    <div class="card sosv">
      <h2 style="justify-content:center;margin:0" data-i="sos_t"></h2>
      <p class="muted" data-i="sos_s"></p>
      <button class="sosbig" id="sosBig">SOS</button>
      <p class="muted" data-i="sos_note"></p>
    </div>
    <div class="card locbox">
      <h2 style="margin:0 0 2px" data-i="my_loc"></h2>
      <div class="coords" id="coords"></div>
      <div class="row">
        <a class="btn btn-ghost hidden" id="mapLink" target="_blank" rel="noopener" data-i="open_map"></a>
        <button class="btn btn-ghost hidden" id="copyLoc" data-i="copy_loc"></button>
      </div>
      <p class="muted" style="margin-top:8px" data-i="loc_tip"></p>
    </div>
  </section>
</div>

<nav><div class="in">
  <button data-go="home" class="on"><span class="ic">🏠</span><span data-i="nav_home"></span></button>
  <button data-go="hist"><span class="ic">🗺️</span><span data-i="nav_hist"></span></button>

  }
  function playUrl(url, c, my) {
    return new Promise((res) => {
      const lens = R.sents.slice(c.from, c.to).map((s) => s.length), tot = lens.reduce((a, b) => a + b, 0) || 1;
      audio.onended = () => res(true);
      audio.onerror = () => res(false);
      audio.ontimeupdate = () => {
        if (my !== R.token || !audio.duration) return;
        const target = (audio.currentTime / audio.duration) * tot;
        let acc = 0, k = 0; while (k < lens.length - 1 && acc + lens[k] < target) { acc += lens[k]; k++; }
        if (R.hl !== c.from + k) { setHL(c.from + k); R.resumeAt = c.from + k; }
      };
      audio.src = url;
      R.onStop = () => res(false);
      R.resumeAt = c.from;
      // Nếu trình duyệt chặn tự phát: chờ khách bấm ▶ rồi phát tiếp đúng chỗ
      audio.play().then(() => { if (my === R.token) { setState("playing"); setHL(c.from); } })
        .catch(() => { if (my === R.token) setState("paused"); });
    });
  }
  function deviceFrom(i, my) {
    R.mode = "device";
    if (!("speechSynthesis" in window)) { setState("idle"); return; }
    const code = LANGS[(cur && cur.lang) || lang].code, voice = bestVoice(code);
    if (!voice && code.startsWith("vi")) toast(t("no_vi_voice"));
    const next = (k) => {
      if (my !== R.token) return;
      if (k >= R.sents.length) { setState("idle"); setHL(-1); R.resumeAt = 0; return; }
      const u = new SpeechSynthesisUtterance(R.sents[k]);
      u.lang = code; if (voice) u.voice = voice;
      u.rate = 1.0; u.pitch = voiceStyle.endsWith("_m") ? 0.95 : 1.08;
      u.onstart = () => { if (my === R.token) { setState("playing"); setHL(k); R.resumeAt = k; } };
      u.onend = () => setTimeout(() => next(k + 1), 180); // ngắt nghỉ tự nhiên giữa các câu
      u.onerror = () => { if (my === R.token) setState("idle"); };
      speechSynthesis.speak(u);
    };
    next(i);
  }
  function pause() {
    if (R.mode === "ai") { audio.pause(); setState("paused"); return; }
    R.token++; if ("speechSynthesis" in window) speechSynthesis.cancel();
    setState("paused");
  }
  function resume() {
    if (R.mode === "ai" && audio.src && audio.src !== SILENT && !audio.ended) {
      audio.play().then(() => { setState("playing"); if (R.hl < 0) setHL(R.resumeAt); }).catch(() => play(R.resumeAt || 0));
      return;
    }
    play(R.resumeAt || 0);
  }
  function stopAudio() {
    R.token++; if (R.onStop) R.onStop();
    audio.pause(); if ("speechSynthesis" in window) speechSynthesis.cancel();
    R.resumeAt = 0; setState("idle"); setHL(-1);
  }
  $("pPlay").onclick = () => { if (R.state === "playing") pause(); else if (R.state === "paused") resume(); else if (R.state === "idle") play(0); };
  $("pStop").onclick = stopAudio;

  /* ================= Giao diện ================= */
  const VIEWS = ["home", "place", "hist", "sos"];
  let view = "home";
  function go(v) {
    if (v !== "place" && view === "place") stopAudio();
    view = v;
    VIEWS.forEach((x) => $("v-" + x).classList.toggle("hidden", x !== v));
    document.querySelectorAll("nav [data-go]").forEach((b) => b.classList.toggle("on", b.dataset.go === v));
    window.scrollTo({ top: 0 });
    if (v === "hist") renderHist();
    if (v === "sos") locate();
  }
  document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => go(b.dataset.go)));

  function applyI18n() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i]").forEach((e) => (e.textContent = t(e.dataset.i)));
    document.querySelectorAll("[data-ph]").forEach((e) => (e.placeholder = t(e.dataset.ph)));
    $("langFlag").textContent = LANGS[lang].flag; $("langCode").textContent = lang.toUpperCase();
    $("aiDot").className = "dot" + (getKey() ? "" : " off");
    $("langBtn").title = getKey() ? t("ai_on") : t("ai_off");
    renderPop(); renderRecent(); renderSettings(); renderPlayer();
    if (view === "hist") renderHist();
  }
  function renderPop() {
    const box = $("pop"); box.innerHTML = "";
    POPULAR.forEach(([e, vi, en]) => {
      const b = el("button"); b.type = "button";
      b.append(el("span", "e", e), el("span", null, lang === "vi" ? vi : en));
      b.onclick = () => searchPlace(lang === "vi" ? vi : en);
      box.appendChild(b);
    });
  }

  /* ---- Ngôn ngữ & cài đặt ---- */
  function renderSettings() {
    const ls = $("langs"); ls.innerHTML = "";
    Object.entries(LANGS).forEach(([k, v]) => {
      const b = el("button", "lang" + (k === lang ? " on" : "")); b.type = "button";
      b.append(el("span", null, v.flag), el("span", null, v.label));
      b.onclick = () => setLang(k);
      ls.appendChild(b);
    });
    $("swVoice").classList.toggle("on", aiVoice);
    $("voiceWrap").classList.toggle("hidden", !aiVoice);
    const vs = $("voiceSeg"); vs.innerHTML = "";
    Object.keys(VOICES).forEach((k) => {
      const b = el("button", k === voiceStyle ? "on" : "", t("v_" + k)); b.type = "button";
      b.onclick = () => { voiceStyle = k; store.set("voice", k); renderSettings(); renderPlayer(); };
      vs.appendChild(b);
    });
    [...$("lenSeg").children].forEach((b) => b.classList.toggle("on", b.dataset.len === len));
    $("swFocus").classList.toggle("on", focus);
  }
  function setLang(k) {
    if (k === lang) return;
    lang = k; store.set("lang", k); applyI18n();
    // Đang xem một địa điểm -> thuyết minh lại bằng ngôn ngữ mới
    if (view === "place" && cur && cur.lang !== k) runGuide({ name: cur.name, photo: curPhoto });
  }
  const openSheet = (id) => $(id).classList.remove("hidden");
  const closeSheet = (id) => $(id).classList.add("hidden");
  document.querySelectorAll(".sheetbg").forEach((s) => s.addEventListener("click", (e) => { if (e.target === s) s.classList.add("hidden"); }));
  $("langBtn").onclick = $("navLang").onclick = () => openSheet("langSheet");
  $("langDone").onclick = () => closeSheet("langSheet");
  $("swVoice").onclick = () => { aiVoice = !aiVoice; store.set("aiVoice", aiVoice); if (aiVoice) { ttsOffUntil = 0; store.set("ttsOff", 0); } renderSettings(); renderPlayer(); };
  $("swFocus").onclick = () => { focus = !focus; store.set("focus", focus); renderSettings(); };
  $("lenSeg").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; len = b.dataset.len; store.set("len", len); renderSettings(); };

  function openKey() { $("keyIn").value = store.get("key", ""); openSheet("keySheet"); }
  $("keySave").onclick = () => { store.set("key", $("keyIn").value.trim()); store.set("models", null); modelsReady = null; closeSheet("keySheet"); applyI18n(); };
  $("keyLater").onclick = () => closeSheet("keySheet");

  /* ---- Ảnh ---- */
  async function compress(file, max = 768) {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const url = c.toDataURL("image/jpeg", 0.78);
    const tc = document.createElement("canvas"), ts = 160 / Math.max(c.width, c.height);
    tc.width = c.width * ts; tc.height = c.height * ts; tc.getContext("2d").drawImage(c, 0, 0, tc.width, tc.height);
    return { b64: url.split(",")[1], url, thumb: tc.toDataURL("image/jpeg", 0.7) };
  }
  let lastPos = null;
  function getGps(wait = 800) {
    return new Promise((res) => {
      if (!navigator.geolocation) return res(lastPos || {});
      const timer = setTimeout(() => res(lastPos || {}), wait);
      navigator.geolocation.getCurrentPosition((p) => {
        lastPos = { lat: p.coords.latitude.toFixed(5), lng: p.coords.longitude.toFixed(5) };
        clearTimeout(timer); res(lastPos);
      }, () => { clearTimeout(timer); res(lastPos || {}); }, { timeout: 5000, maximumAge: 600000, enableHighAccuracy: false });
    });
  }
  document.querySelectorAll(".fileIn").forEach((inp) => inp.addEventListener("change", async (e) => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    try {
      const [img, gps] = await Promise.all([compress(f), getGps()]);
      runGuide({ imageBase64: img.b64, photo: img.url, thumb: img.thumb, ...gps });
    } catch { toast(t("err_gen")); }
  }));
  $("searchForm").onsubmit = (e) => { e.preventDefault(); const q = $("searchIn").value.trim(); if (q) { $("searchIn").blur(); searchPlace(q); } };
  const searchPlace = (name) => runGuide({ name });

  /* ---- Màn hình địa điểm ---- */
  let cur = null, curPhoto = null, curThumb = null, runId = 0, chatLog = [];
  function setHero(photo, emoji = "🏛️") {
    const h = $("pHero");
    h.style.backgroundImage = photo ? `url("${photo}")` : "";
    $("pEmoji").textContent = photo ? "" : emoji;
  }
  function setScanning(on) { $("pScan").classList.toggle("hidden", !on); $("pCorners").classList.toggle("hidden", !on); }
  function status(txt) { $("pStatus").classList.toggle("hidden", !txt); $("pStatusT").textContent = txt || ""; }

  async function runGuide(o) {
    const my = ++runId;
    stopAudio(); go("place");
    cur = null; chatLog = [];
    curPhoto = o.photo || null; curThumb = o.thumb || curThumb;
    if (!o.photo) curThumb = null;
    setHero(curPhoto); setScanning(!!o.imageBase64);
    $("pTitle").textContent = o.name || t("identifying");
    $("pLoc").textContent = ""; $("pBadge").classList.add("hidden");
    $("player").classList.add("hidden"); $("pNF").classList.add("hidden"); $("pMore").innerHTML = ""; $("askCard").classList.add("hidden");
    const n = $("pNarr"); n.className = "narr"; n.innerHTML = '<div class="skel"></div><div class="skel" style="width:92%"></div><div class="skel" style="width:76%"></div>';
    status(o.imageBase64 ? t("scanning") : t("writing"));
    let prefetched = false;
    try {
      const res = await fastGuide({ ...o, lang, style: len }, (p) => {
        if (my !== runId) return;
        if (p.title || p.name) $("pTitle").textContent = p.title || p.name;
        if (p.place) $("pLoc").textContent = "📍 " + p.place;
        if (p.narration) {
          setScanning(false); status(t("writing"));
          n.classList.add("typing"); n.textContent = p.narration;
          // Chuẩn bị giọng đọc cho 2 câu đầu ngay khi AI vừa viết xong 2 câu
          if (!prefetched && aiVoice) {
            const ss = splitS(p.narration);
            if (ss.length >= 3) { prefetched = true; ttsUrl(chunksOf(ss)[0].text); }
          }
        }
      });
      if (my !== runId) return;
      setScanning(false); status("");
      if (!res.ok) return showNotFound(res.landmark);
      showPlace(res.place, true);
      saveHistory(res.place, curThumb);
    } catch (e) {
      if (my !== runId) return;
      setScanning(false); status("");
      n.className = "narr"; n.innerHTML = "";
      const p = el("p", null, errText(e)); p.style.whiteSpace = "pre-line"; n.appendChild(p);
      const b = el("button", "btn btn-primary", "↻ " + t("retry")); b.style.marginTop = "12px"; b.onclick = () => runGuide(o); n.appendChild(b);
    }
  }

  function showNotFound(l) {
    $("pTitle").textContent = "🤔 " + t("nf_t");
    $("pNarr").className = "narr"; $("pNarr").innerHTML = "";
    const box = $("pNF"); box.innerHTML = ""; box.classList.remove("hidden");
    box.appendChild(el("p", "muted", l.is_landmark ? t("nf_land") : t("nf_obj")));
    if (l.alternatives && l.alternatives.length) {
      const s = el("div", "sec"); s.appendChild(el("h4", null, t("maybe")));
      const c = el("div", "chips");
      l.alternatives.slice(0, 4).forEach((a) => { const b = el("button", "chip go", a); b.type = "button"; b.onclick = () => searchPlace(a); c.appendChild(b); });
      s.appendChild(c); box.appendChild(s);
    }
  }

  function showPlace(d, autoplay) {
    cur = d;
    $("pTitle").textContent = d.title || d.name;
    const loc = [d.name !== d.title ? d.name : "", d.city, d.country].filter(Boolean).join(" · ");
    $("pLoc").textContent = loc ? "📍 " + loc + (d.category ? "  ·  " + d.category : "") : "";
    if (d.confidence && d.confidence < 1) { $("pBadge").textContent = Math.round(d.confidence * 100) + "% " + t("match"); $("pBadge").classList.remove("hidden"); }
    const n = $("pNarr"); n.className = "narr"; n.innerHTML = "";
    prepareReader(d.narration);
    R.sents.forEach((s, i) => { const sp = el("span", "s", s + " "); sp.onclick = () => play(i); n.appendChild(sp); });
    $("player").classList.remove("hidden"); setHL(-1); setState("idle");

    const more = $("pMore"); more.innerHTML = "";
    if (d.facts.length) { const s = el("div", "sec"); s.appendChild(el("h4", null, t("facts"))); const f = el("div", "facts"); d.facts.forEach((x) => f.appendChild(el("div", null, x))); s.appendChild(f); more.appendChild(s); }
    if (d.tips.length) { const s = el("div", "sec"); s.appendChild(el("h4", null, t("tips"))); const u = el("ul"); d.tips.forEach((x) => u.appendChild(el("li", null, x))); s.appendChild(u); more.appendChild(s); }
    if (d.nearby.length) {
      const s = el("div", "sec"); s.appendChild(el("h4", null, t("nearby"))); const c = el("div", "chips");
      d.nearby.forEach((x) => { const b = el("button", "chip go", "📍 " + x); b.type = "button"; b.onclick = () => searchPlace(x + (d.city ? ", " + d.city : "")); c.appendChild(b); });
      s.appendChild(c); more.appendChild(s);
    }
    const lv = el("div", "sec");
    const lb = el("button", "btn btn-ghost", "🔄 " + t("live_btn")); lb.type = "button"; lb.style.width = "100%";
    lb.onclick = async () => {
      lb.disabled = true; lb.textContent = t("live_load");
      try {
        const r = await gem("text", M.FAST, {
          contents: [{ role: "user", parts: [{ text: `Search Google for the LATEST visitor information about "${d.name}"${d.city ? ", " + d.city : ""}${d.country ? ", " + d.country : ""}: opening hours, ticket prices, current notices (renovation, events, dress code). Answer in ${LANGS[d.lang].name}, 3-5 short lines, each starting with "- ". If nothing reliable is found, say so.` }] }],
          tools: [{ google_search: {} }],
        });
        lv.innerHTML = "";
        lv.appendChild(el("h4", null, r._searched ? t("live_t") : t("live_nosearch")));
        const u = el("ul"); textOf(r).split("\n").map((s) => s.replace(/^[-*•]\s*/, "").replace(/\*\*/g, "").trim()).filter(Boolean).forEach((x) => u.appendChild(el("li", null, x))); lv.appendChild(u);
        const src = srcOf(r.candidates && r.candidates[0] && r.candidates[0].groundingMetadata);
        if (src.length) {
          const sEl = el("div", "muted"); sEl.style.marginTop = "6px"; sEl.appendChild(document.createTextNode(t("sources") + ": "));
          src.forEach((x, i) => { const a = el("a", null, x.title || x.url); a.href = x.url; a.target = "_blank"; a.rel = "noopener"; sEl.appendChild(a); if (i < src.length - 1) sEl.appendChild(document.createTextNode(" · ")); });
          lv.appendChild(sEl);
        }
      } catch (e) { lb.disabled = false; lb.textContent = "🔄 " + t("retry"); toast(errText(e).split("\n")[0]); }
    };
    lv.appendChild(lb); more.appendChild(lv);
    more.appendChild(el("div", "disc", t("disc")));

    $("askCard").classList.remove("hidden"); $("chat").innerHTML = "";
    const sg = $("suggest"); sg.innerHTML = "";
    d.questions.forEach((q) => { const b = el("button", "chip go", q); b.type = "button"; b.onclick = () => ask(q); sg.appendChild(b); });
    if (autoplay) play(0);
  }
  $("pBack").onclick = () => go("home");

  /* ---- Hướng dẫn viên AI: trả lời dạng stream ---- */
  $("askForm").onsubmit = (e) => { e.preventDefault(); const q = $("askIn").value.trim(); if (q) ask(q); };
  async function ask(q) {
    if (!cur) return;
    $("askIn").value = "";
    $("chat").appendChild(el("div", "msg me", q));
    const bubble = el("div", "msg ai", t("thinking")); $("chat").appendChild(bubble);
    bubble.scrollIntoView({ behavior: "smooth", block: "center" });
    $("askBtn").disabled = true;
    const contents = [];
    chatLog.slice(-6).forEach((h) => { contents.push({ role: "user", parts: [{ text: h.q }] }); contents.push({ role: "model", parts: [{ text: h.a }] }); });
    contents.push({ role: "user", parts: [{ text: q }] });
    const needSearch = /giá|vé|giờ|mở cửa|đóng cửa|hôm nay|bây giờ|thời tiết|sự kiện|price|ticket|open|hour|weather|today|料金|時間|가격|시간|prix|horaire/i.test(q);
    try {
      const r = await gem("text", M.FAST, {
        systemInstruction: { parts: [{ text: `You are a friendly, witty local tour guide in Vietnam. The tourist is at: ${cur.name}${cur.city ? ", " + cur.city : ""}. What you already told them: ${cur.narration.slice(0, 500)}
Answer in ${LANGS[lang].name}, 1-4 short sentences, conversational, plain text, no markdown. If unsure about prices or hours, say to check on site.` }] },
        contents, generationConfig: { temperature: 0.7 },
        ...(needSearch ? { tools: [{ google_search: {} }] } : {}),
      }, (s) => { bubble.textContent = s; });
      chatLog.push({ q, a: r.text });
      bubble.textContent = r.text || "…";
    } catch (e) { bubble.textContent = errText(e); }
    finally { $("askBtn").disabled = false; }
  }

  /* ---- Lịch sử ---- */
  function saveHistory(d, thumb) {
    const h = store.get("hist", []).filter((x) => x.d.name !== d.name);
    h.unshift({ d, thumb: thumb || null, t: Date.now() });
    store.set("hist", h.slice(0, 20)); renderRecent();
  }
  function openHist(x) {
    if (x.d.lang === lang && x.d.style === len) { stopAudio(); go("place"); curPhoto = null; curThumb = x.thumb; setHero(x.thumb); setScanning(false); status(""); chatLog = []; $("pNF").classList.add("hidden"); showPlace(x.d, false); }
    else { curThumb = x.thumb; runGuide({ name: x.d.name, photo: x.thumb }); }
  }
  function histImg(x, cls) { const d = el("div", cls); if (x.thumb) d.style.backgroundImage = `url("${x.thumb}")`; else d.textContent = "🏛️"; return d; }
  function renderRecent() {
    const h = store.get("hist", []); $("recentWrap").classList.toggle("hidden", !h.length);
    const box = $("recent"); box.innerHTML = "";
    h.slice(0, 8).forEach((x) => { const b = el("button", "rc"); b.type = "button"; b.append(histImg(x, "img"), el("b", null, x.d.title || x.d.name)); b.onclick = () => openHist(x); box.appendChild(b); });
  }
  function renderHist() {
    const h = store.get("hist", []), box = $("hist"); box.innerHTML = "";
    if (!h.length) { box.appendChild(el("p", "muted", t("hist_empty"))); return; }
    h.forEach((x) => {
      const b = el("button", "hi"); b.type = "button";
      const tx = el("div"); tx.append(el("b", null, x.d.title || x.d.name), el("span", "muted", [x.d.city, new Date(x.t).toLocaleDateString(LANGS[lang].code)].filter(Boolean).join(" · ")));
      b.append(histImg(x, "img"), tx); b.onclick = () => openHist(x); box.appendChild(b);
    });
  }

  /* ---- SOS ---- */
  $("sosBig").onclick = () => openSheet("sosSheet");
  $("sosCancel").onclick = () => closeSheet("sosSheet");
  function locate() {
    $("coords").textContent = t("loc_wait");
    if (!navigator.geolocation) { $("coords").textContent = t("loc_na"); return; }
    navigator.geolocation.getCurrentPosition((p) => {
      const la = p.coords.latitude.toFixed(5), lo = p.coords.longitude.toFixed(5);
      lastPos = { lat: la, lng: lo };
      $("coords").textContent = `${la}, ${lo}`;
      const m = $("mapLink"); m.href = `https://www.google.com/maps?q=${la},${lo}`; m.classList.remove("hidden");
      $("copyLoc").classList.remove("hidden");
    }, () => { $("coords").textContent = t("loc_na"); }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  }
  $("copyLoc").onclick = async () => {
    if (!lastPos) return;
    const txt = `${lastPos.lat}, ${lastPos.lng} – https://www.google.com/maps?q=${lastPos.lat},${lastPos.lng}`;
    try { await navigator.clipboard.writeText(txt); toast(t("copied")); } catch { toast(txt); }
  };

  /* ---- Khởi động ---- */
  applyI18n();
  if (!getKey()) setTimeout(openKey, 500); else resolveModels(); // làm nóng kết nối trước khi khách bấm
})();

</script>
